apiVersion: apps/v1
kind: Deployment
metadata:
  name: be-wiki
  namespace: services
  labels:
    app.kubernetes.io/environment: production
    app.kubernetes.io/commit: static
  annotations:
    kubernetes.io/change-cause: static-deploy
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: be-wiki
      app.kubernetes.io/environment: production
  progressDeadlineSeconds: 250
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  revisionHistoryLimit: 2
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/environment: production
        app.kubernetes.io/name: be-wiki
    spec:
      enableServiceLinks: false
      serviceAccountName: be-wiki
      terminationGracePeriodSeconds: 30
      containers:
        - name: be-wiki
          image: 400472617168.dkr.ecr.eu-north-1.amazonaws.com/forkmost:latest
          imagePullPolicy: Always
          ports:
            - name: primary
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '3000'
            - name: APP_URL
              value: 'https://wiki.prod.driffle.com'
            - name: REDIS_URL
              value: 'redis://be-wiki-redis.services.svc.cluster.local:6379'
            - name: STORAGE_DRIVER
              value: 's3'
            - name: DISABLE_TELEMETRY
              value: 'true'
          envFrom:
            - secretRef:
                name: be-wiki
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: 1000m
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            httpGet:
              path: /api/health/live
              port: 3000
              scheme: HTTP
          readinessProbe:
            failureThreshold: 3
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            httpGet:
              path: /api/health
              port: 3000
              scheme: HTTP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: be-wiki-redis
  namespace: services
  labels:
    app.kubernetes.io/name: be-wiki-redis
    app.kubernetes.io/environment: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: be-wiki-redis
      app.kubernetes.io/environment: production
  template:
    metadata:
      labels:
        app.kubernetes.io/name: be-wiki-redis
        app.kubernetes.io/environment: production
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --appendonly
            - 'no'
            - --save
            - ''
            - --maxmemory-policy
            - noeviction
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 512Mi
              cpu: 300m
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
